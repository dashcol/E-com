<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Search Products</title>
  </head>
  <body>
    <div class="container">
      <h1 class="head">E-Commerce Product Page</h1>
      <div class="search">
        <input
          type="text"
          id="search"
          class="search-bar"
          placeholder="Search for Products..."
          oninput="applyFilters()"
        />
        <div class="dropdown">
          <select
            id="price-range"
            class="form-control"
            onchange="applyFilters()"
          >
            <option value="">Select Price Range</option>
            <option value="0-50">Under $50</option>
            <option value="51-100">$51-$100</option>
            <option value="101-200">$101-$200</option>
            <option value="201-300">$201-$300</option>
            <option value="301-500">$301-$500</option>
            <option value="501-1000">$501-$1000</option>
          </select>
        </div>
      </div>
      <div id="product-list" class="products"></div>
      <div id="error-message"></div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        class Product {
          constructor(name, price, description, image) {
            this.name = name;
            this.price = price;
            this.description = description;
            this.image = image;
          }
          display() {
            return `
            <div class="col-1">
              <div class="card">
                <img src="${this.image}" class="card-img" alt="${this.name}">
                <div class="card-body">
                  <h5 class="card-title">${this.name}</h5>
                  <p class="card-text">${this.description}</p>
                  <p class="card-text">$${this.price.toFixed(2)}</p>
                  <div class="quantity">
                    <input type="number" class="quantity-input" value="1" min="1">
                    <a href="#" class="cart-button add-to-cart" data-product='${JSON.stringify(
                      this
                    )}'>Add to Cart</a>
                  </div>
                </div>
              </div>
            </div>
          `;
          }
        }

        class DiscountedProduct extends Product {
          constructor(name, price, description, image, discount) {
            super(name, price, description, image);
            this.discount = discount;
          }

          display() {
            const discountedPrice = this.price - this.price * (this.discount / 100);
            return `
            <div class="col-1">
              <div class="card">
                <img src="${this.image}" class="card-img" alt="${this.name}">
                <div class="card-body">
                  <h5 class="card-title">${this.name}</h5>
                  <p class="card-text">${this.description}</p>
                  <p class="card-text">$${discountedPrice.toFixed(2)}
                    <span class="badge">${this.discount}% OFF</span></p>
                    <div class="quantity">
                    <input type="number" class="quantity-input" value="1" min="1">
                    <a href="#" class="cart-button add-to-cart" data-product='${JSON.stringify(
                      this
                    )}'>Add to Cart</a>
                  </div>
                </div>
              </div>
            </div>
          `;
          }
        }

        const discountedProduct = new DiscountedProduct(
          "Dummy Discounted Product",
          40.0,
          "This is a dummy discounted product",
          "https://via.placeholder.com/400x300?text=Discounted+Product",
          20
        );

        fetch("products.json")
          .then((response) => {
            if (!response.ok) throw new Error("Network response was not ok");
            return response.json();
          })
          .then((data) => {
            window.products = data;
            displayProducts(data);

            const productList = document.getElementById("product-list");
            productList.innerHTML += discountedProduct.display();

            attachEventListeners();
          })
          .catch((error) => {
            console.error("Error fetching products:", error);
            document.getElementById("error-message").textContent =
              "Failed to load products. Please try again later.";
          });

        function displayProducts(products) {
          const productList = document.getElementById("product-list");
          productList.innerHTML = "";
          products.forEach((product) => {
            const card = document.createElement("div");
            card.classList.add("col-1");
            card.innerHTML = `
            <div class="card">
              <img src="${product.image}" class="card-img" alt="${product.name}">
              <div class="card-body">
                <h5 class="card-title">${product.name}</h5>
                <p class="card-text">${product.description}</p>
                <p class="card-text">$${product.price.toFixed(2)}</p>
                <div class="quantity">
                  <input type="number" class="quantity-input" value="1" min="1">
                  <a href="#" class="cart-button add-to-cart" data-product='${JSON.stringify(
                    product
                  )}'>Add to Cart</a>
                </div>
              </div>
            </div>`;
            productList.appendChild(card);
          });
          attachEventListeners();
        }

        function attachEventListeners() {
          document.querySelectorAll(".add-to-cart").forEach((button) => {
            button.addEventListener("click", (event) => {
              event.preventDefault();
              try {
                const product = JSON.parse(event.target.getAttribute("data-product"));
                const quantityInput = event.target.previousElementSibling;
                const quantity = parseInt(quantityInput.value);
                if (isNaN(quantity) || quantity <= 0) {
                  throw new Error("Invalid Quantity");
                }
                addToCart(product, quantity);
              } catch (error) {
                console.error("Error handling add-to-cart event:", error);
                alert("Error adding product to cart. Please check the quantity and try again.");
              }
            });
          });
        }

        function addToCart(product, quantity) {
          try {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            const existingProduct = cart.find((item) => item.name === product.name);
            if (existingProduct) {
              existingProduct.quantity += quantity;
            } else {
              product.quantity = quantity;
              cart.push(product);
            }
            localStorage.setItem("cart", JSON.stringify(cart));
            alert("Product added to cart");
          } catch (error) {
            console.error("Error adding product to cart", error);
            alert("Failed to add product to cart. Please try again later");
          }
        }

        function handleSearch(query) {
          try {
            const filteredProducts = window.products.filter((product) =>
              product.name.toLowerCase().includes(query.toLowerCase())
            );
            displayProducts(filteredProducts);
          } catch (error) {
            console.error("Error handling search", error);
            document.getElementById("error-message").textContent =
              "Error processing search. Please try again later.";
          }
        }

        function debounce(func, delay) {
          let timerId;
          return function (...args) {
            clearTimeout(timerId);
            timerId = setTimeout(() => func.apply(this, args), delay);
          };
        }

        function throttle(func, limit) {
          let lastFunc;
          let lastRan = 0;
          return function (...args) {
            const context = this;
            const now = Date.now();
            if (now - lastRan >= limit) {
              func.apply(context, args);
              lastRan = now;
            } else {
              clearTimeout(lastFunc);
              lastFunc = setTimeout(function () {
                func.apply(context, args);
                lastRan = now;
              }, limit - (now - lastRan));
            }
          };
        }

        const searchInput = document.getElementById("search");
        searchInput.addEventListener(
          "input",
          debounce(function () {
            handleSearch(this.value);
          }, 3000)
        );

        function applyFilters() {
          const query = document.getElementById("search").value.toLowerCase();
          const priceRange = document.getElementById("price-range").value;

          let minPrice = 0;
          let maxPrice = Infinity;
          if (priceRange) {
            [minPrice, maxPrice] = priceRange.split("-").map(Number);
          }
          const filteredProducts = window.products.filter((product) => {
            const isNameMatch = product.name.toLowerCase().includes(query);
            const isDescriptionMatch = product.description.toLowerCase().includes(query);
            const isPriceMatch = product.price >= minPrice && product.price <= maxPrice;
            return (isNameMatch || isDescriptionMatch) && isPriceMatch;
          });

          displayProducts(filteredProducts);
        }
        document.getElementById("price-range").addEventListener("change", applyFilters);
      });
    </script>
  </body>
</html>
