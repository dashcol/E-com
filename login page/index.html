<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="register">
        <input
          type="radio"
          id="sign-up-radio"
          name="auth"
          onclick="toggleForm('signup')"
        />
        <label for="sign-up-radio">Sign Up</label>

        <input
          type="radio"
          id="sign-in-radio"
          name="auth"
          onclick="toggleForm('signin')"
          checked
        />
        <label for="sign-in-radio">Sign In</label>
      </div>

      <div class="signin" style="display: block">
        <h1><b>SIGN IN</b></h1>
        <form onsubmit="return signIn()">
          <div class="input">
            <input
              type="email"
              placeholder="Email"
              id="userEmail"
              name="email"
              required
            />

            <div class="password-field">
              <input
                type="password"
                placeholder="Password"
                id="password"
                name="pass"
                required
              />
              <span
                onclick="togglePassword('password', 'togglePasswordIconSignIn')"
                class="toggle-password"
                id="togglePasswordIconSignIn"
                >👁️</span
              >
            </div>
          </div>
          <button type="submit">Sign In</button>
        </form>
        <p>
          Don't have an account?
          <a href="#" onclick="toggleForm('signup')">Sign up here</a>
        </p>
      </div>

      <div class="signup" style="display: none">
        <h1><b>SIGN UP</b></h1>
        <form onsubmit="return checkDetails()">
          <div class="input">
            <input
              type="text"
              placeholder="Fullname"
              id="name"
              name="name"
              required
            />
            <input
              type="email"
              placeholder="Email"
              id="email"
              name="email"
              required
            />

            <div class="password-field">
              <input
                type="password"
                placeholder="Password"
                id="signinPassword"
                name="pass"
                required
              />
              <span
                onclick="togglePassword('signinPassword', 'togglePasswordIconSignUp')"
                class="toggle-password"
                id="togglePasswordIconSignUp"
                >👁️</span
              >
            </div>

            <div class="password-field">
              <input
                type="password"
                placeholder="Confirm Password"
                id="confirmPassword"
                name="pass"
                required
              />
              <span
                onclick="togglePassword('confirmPassword', 'togglePasswordIconConfirm')"
                class="toggle-password"
                id="togglePasswordIconConfirm"
                >👁️</span
              >
            </div>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <p>
          Already have an account?
          <a href="#" onclick="toggleForm('signin')">Sign in here</a>
        </p>
      </div>
    </div>

    <script>
      function toggleForm(form) {
        document.querySelector(".signin").style.display = "none";
        document.querySelector(".signup").style.display = "none";

        if (form === "signin") {
          document.querySelector(".signin").style.display = "block";
        } else if (form === "signup") {
          document.querySelector(".signup").style.display = "block";
        }
      }

      function togglePassword(fieldId, iconId) {
        const passwordField = document.getElementById(fieldId);
        const icon = document.getElementById(iconId);
        if (passwordField.type === "password") {
          passwordField.type = "text";
          icon.textContent = "🙈"; // Change to "Hide" icon
        } else {
          passwordField.type = "password";
          icon.textContent = "👁️"; // Change to "Show" icon
        }
      }

      function checkDetails() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("signinPassword").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {
          alert("Please enter a valid email.");
          return false;
        }
        if (password !== confirmPassword) {
          alert("Passwords do not match. Please try again.");
          return false;
        }

        alert("Sign Up successful!");
        localStorage.setItem("email", email);
        localStorage.setItem("password", password);
        return false;
      }

      function signIn() {
        const savedEmail = localStorage.getItem("email");
        const savedPassword = localStorage.getItem("password");

        const userEmail = document.getElementById("userEmail").value;
        const userPassword = document.getElementById("password").value;

        if (!savedEmail || !savedPassword) {
          alert("No account found. Please sign up first.");
          return false;
        }

        if (userEmail === savedEmail && userPassword === savedPassword) {
          alert("Welcome!");
          return false;
        } else {
          alert("Invalid email or password. Please try again.");
          return false;
        }
      }
    </script>
  </body>
</html>
